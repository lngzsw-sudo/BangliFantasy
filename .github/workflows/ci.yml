name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    services:
      # Real Postgres so the database store is tested, not just the JSON one.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bangli
          POSTGRES_PASSWORD: bangli
          POSTGRES_DB: bangli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bangli"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bangli:bangli@localhost:5432/bangli_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
