# Render Blueprint: one free web service running the game server.
# Render injects PORT; the server reads it. WebSockets work out of the box.
services:
  - type: web
    name: bangli-fantasy
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Postgres connection string (Neon, Supabase, …). Without it, accounts
      # live in a JSON file that Render wipes on every deploy.
      - key: DATABASE_URL
        sync: false
